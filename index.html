<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Tracker</title>
    <link rel="stylesheet" href="css/bar.css">
    <link rel="stylesheet" href="css/custom-ui.css">
    <link rel="icon" href="https://www.svgrepo.com/show/316531/calendar-link.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div id="override-overlay" class="override-overlay">
        <div id="override-text" class="override-text">MESSAGE</div>
    </div>

    <!-- First Time "Who's this?" Modal -->
    <div id="user-identify-modal" class="identify-modal" style="display: none;">
        <div class="identify-card">
            <h3>Who's this?</h3>
            <p class="identify-sub">Used only for fixing errors and applying changes dynamically.</p>
            <div class="identify-input-row">
                <input type="text" id="identify-input" placeholder="e.g. Room 102 TV, John's Laptop">
                <button id="identify-submit-btn">Save</button>
                <button id="identify-skip-btn" class="btn-skip">Skip</button>
            </div>
        </div>
    </div>


    <div class="background_container">
        <header class="title_container">
            <div class="left-header-group">
                <div id="date-container" class="top-bar-item header-pill">
                    <span id="date-display">Mon --- --</span>
                </div>
                <div id="weather-container" class="top-bar-item header-pill">
                    <span id="weather-display" class="weather-text">--°</span>
                </div>
            </div>
            <div id="clock-display" class="top-bar-item header-pill">00:00:00</div>
            <div class="right-header-placeholder top-bar-item"></div>
        </header>

        <main class="main-content">
            <div id="end" class="end-message">Have a great day!</div>

            <div class="schedule-wrapper">
                <div class="tracker-item">
                    <div class="text_container">
                        <span class="period">---</span>
                    </div>
                    <div class="progress_container">
                        <div class="progress_bar bar-style-liquid">
                        <svg class="gummy-wave-svg" viewBox="0 0 100 200" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="gummyShine" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
                                    <stop offset="32%" stop-color="#ffffff" stop-opacity="0.15" />
                                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
                                </linearGradient>
                            </defs>
                            <path class="gummy-base" fill="var(--bar-color)" d="M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z">
                                <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
                                    values="
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z;
                                    M 0,0 L 18,0 C 75,30 55,75 75,105 C 95,145 55,170 18,200 L 0,200 Z;
                                    M 0,0 L 12,0 C 45,15 88,60 55,100 C 35,130 90,165 12,200 L 0,200 Z;
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z" />
                            </path>
                            <path fill="url(#gummyShine)" d="M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z">
                                <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
                                    values="
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z;
                                    M 0,0 L 18,0 C 75,30 55,75 75,105 C 95,145 55,170 18,200 L 0,200 Z;
                                    M 0,0 L 12,0 C 45,15 88,60 55,100 C 35,130 90,165 12,200 L 0,200 Z;
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z" />
                            </path>
                        </svg>
                    </div>
                        <span class="progress_time">--:--</span>
                    </div>
                </div>

                <div class="tracker-item">
                    <div class="text_container">
                        <span class="period">---</span>
                    </div>
                    <div class="progress_container">
                        <div class="progress_bar bar-style-liquid">
                        <svg class="gummy-wave-svg" viewBox="0 0 100 200" preserveAspectRatio="none">
                            <defs>
                                <linearGradient id="gummyShine" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
                                    <stop offset="32%" stop-color="#ffffff" stop-opacity="0.15" />
                                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
                                    <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
                                </linearGradient>
                            </defs>
                            <path class="gummy-base" fill="var(--bar-color)" d="M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z">
                                <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
                                    values="
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z;
                                    M 0,0 L 18,0 C 75,30 55,75 75,105 C 95,145 55,170 18,200 L 0,200 Z;
                                    M 0,0 L 12,0 C 45,15 88,60 55,100 C 35,130 90,165 12,200 L 0,200 Z;
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z" />
                            </path>
                            <path fill="url(#gummyShine)" d="M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z">
                                <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
                                    values="
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z;
                                    M 0,0 L 18,0 C 75,30 55,75 75,105 C 95,145 55,170 18,200 L 0,200 Z;
                                    M 0,0 L 12,0 C 45,15 88,60 55,100 C 35,130 90,165 12,200 L 0,200 Z;
                                    M 0,0 L 15,0 C 60,18 85,55 65,95 C 45,135 85,175 15,200 L 0,200 Z" />
                            </path>
                        </svg>
                    </div>
                        <span class="progress_time">--:--</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div id="total-time-container" class="total-time-left" style="display: none;">
                <span class="total-time-remaining">0h 0m</span>
            </div>
            <div class="credits">
                <span class="credit-item">By Austin Strong</span>
                <span class="credit-separator">•</span>
                <span class="credit-item report-issue-wrapper"><a href="mailto:austin+mvhsst-issue@astrong.xyz,strongar1+issues@s.dcsdk12.org?subject=Schedule%20Tracker%20Issue" class="report-issue-link" target="_blank" rel="noopener">Report an Issue</a></span>
                <span class="credit-separator">•</span>
                <span class="credit-item"><span id="device-id-display" class="device-id-credit">---</span></span>
            </div>
        </footer>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script src="js/custom-ui.js"></script>
    <script src="js/bar.js"></script>
</body>
</html>
